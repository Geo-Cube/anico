name: Publish container images
on:
  workflow_call:
permissions:
  contents: read
jobs:
  publish:
    # Only a successful CI for a reviewed commit on a deployment branch may publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [breeding-service, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image reference
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anico-${SERVICE}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AniCo ${{ matrix.service }}
          provenance: mode=min
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
      - name: Record immutable image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { SERVICE, IMAGE, DIGEST, GITHUB_SHA } = process.env;
            if (!/^sha256:[a-f0-9]{64}$/.test(DIGEST)) throw new Error("Invalid image digest");
            writeFileSync("image-reference.json", JSON.stringify({ service: SERVICE, image: IMAGE, digest: DIGEST, revision: GITHUB_SHA }, null, 2) + "\n");
          '
          printf '### %s\n\n`%s@%s`\n' "$SERVICE" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reference-${{ matrix.service }}-${{ github.sha }}
          path: image-reference.json
          if-no-files-found: error
          retention-days: 30
