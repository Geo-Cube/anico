name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  containers:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Build and run container checks
        shell: bash
        run: bash scripts/check-containers.sh
      - name: Build and smoke breeder runtime
        shell: bash
        run: bash scripts/check-breeder-container.sh
      - name: Build and smoke animal runtime
        shell: bash
        run: bash scripts/check-animal-container.sh
  check:
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      MONGOMS_VERSION: '7.0.24'
    needs: containers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful container checks on both architectures
        env:
          CONTAINER_RESULT: ${{ needs.containers.result }}
        run: test "$CONTAINER_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        shell: bash
        timeout-minutes: 5
        run: bash .github/scripts/check-secrets.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare a single verified MongoDB binary before parallel tests
        run: npm run test:prepare-db
      - name: Prepare verified NATS binary for publisher integration tests
        run: npm run test:prepare-broker
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:dev-remote
      - run: npm run test:dev-tools
      - run: npm run test:deployment
      - run: npm run test:generators
      - run: npm run build
      - run: npm run test:unit -w @anico/infrastructure
      - run: npm run test:coverage
      - run: npm run test:contract
  e2e:
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      MONGOMS_VERSION: '7.0.24'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare verified MongoDB binary
        run: npm run test:prepare-db
      - name: Prepare verified NATS binary
        run: npm run test:prepare-broker
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e
      - run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/stack-logs
          retention-days: 7
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r infrastructure/ansible/requirements.txt
      - run: bash infrastructure/ansible/check-local.sh
  publish:
    needs: [check, ansible, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
  deploy-dev:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    concurrency:
      group: anico-dev-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-reference-frontend-${{ github.sha }}
          path: image-references/frontend
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-reference-breeding-service-${{ github.sha }}
          path: image-references/breeding-service
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-reference-auth-service-${{ github.sha }}
          path: image-references/auth-service
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-reference-animal-service-${{ github.sha }}
          path: image-references/animal-service
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-reference-breeder-service-${{ github.sha }}
          path: image-references/breeder-service
      - name: Skip superseded dev commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy verified image digests and require healthy services
        if: steps.current.outputs.deploy == 'true'
        env:
          COOLIFY_DEV_SERVICE_UUID: ${{ vars.COOLIFY_DEV_SERVICE_UUID }}
          COOLIFY_DEV_TOKEN: ${{ secrets.COOLIFY_DEV_TOKEN }}
          CF_DEV_DEPLOY_CLIENT_ID: ${{ secrets.CF_DEV_DEPLOY_CLIENT_ID }}
          CF_DEV_DEPLOY_CLIENT_SECRET: ${{ secrets.CF_DEV_DEPLOY_CLIENT_SECRET }}
        run: node scripts/dev-deployment.mjs image-references
