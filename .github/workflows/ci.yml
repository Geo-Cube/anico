name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        shell: bash
        timeout-minutes: 5
        run: bash .github/scripts/check-secrets.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit -w @anico/infrastructure
      - run: npm run test:coverage
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r infrastructure/ansible/requirements.txt
      - run: bash infrastructure/ansible/check-local.sh
