- name: Deploy private durable development event broker
  hosts: anico
  become: true
  gather_facts: false
  pre_tasks:
    - name: Prepare encrypted broker inputs on controller
      ansible.builtin.command:
        argv:
          [
            node,
            --import,
            tsx,
            '{{ playbook_dir }}/../scripts/prepare-dev-events.mjs',
          ]
        chdir: '{{ playbook_dir }}/..'
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      register: anico_events_prepared
    - name: Skip broker until explicitly initialized
      ansible.builtin.meta: end_play
      when: not (anico_events_prepared.stdout | from_json).enabled
  tasks:
    - name: Ensure isolated internal events network
      ansible.builtin.include_tasks: tasks/ensure-network.yml
      vars:
        anico_network:
          name: anico-dev-events
          environment: dev
          role: events
          internal: true
    - name: Inspect an existing broker without reading credentials
      ansible.builtin.command:
        argv:
          [
            docker,
            inspect,
            --format,
            '{{ "{{json .Config.Labels}}" }}',
            anico-dev-events,
          ]
      register: anico_events_existing
      changed_when: false
      failed_when: anico_events_existing.rc not in [0, 1]
      check_mode: false
    - name: Refuse to replace an unrelated broker
      ansible.builtin.assert:
        that:
          - (anico_events_existing.stdout | from_json).get('com.anico.managed-by') == 'ansible'
          - (anico_events_existing.stdout | from_json).get('com.docker.compose.project') == 'anico-dev-events'
      when: anico_events_existing.rc == 0
    - name: Inspect existing event storage
      ansible.builtin.command:
        argv: [docker, volume, inspect, anico-dev-events-data]
      changed_when: false
      failed_when: anico_events_volume.rc not in [0, 1]
      register: anico_events_volume
      check_mode: false
    - name: Refuse unmanaged event storage
      ansible.builtin.assert:
        that:
          - (anico_events_volume.stdout | from_json)[0].Labels['com.anico.environment'] == 'dev'
          - (anico_events_volume.stdout | from_json)[0].Labels['com.anico.managed-by'] == 'ansible'
      when: anico_events_volume.rc == 0
    - name: Prepare broker directory
      ansible.builtin.file:
        path: /srv/anico/dev/events
        state: directory
        owner: root
        group: root
        mode: '0750'
    - name: Install broker configuration
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../.pulumi/dev-events/server.json'
        dest: /srv/anico/dev/events/server.json
        owner: '1000'
        group: '1000'
        mode: '0400'
      no_log: true
      register: anico_events_config
    - name: Install broker compose
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../.pulumi/dev-events/compose.json'
        dest: /srv/anico/dev/events/compose.json
        owner: root
        group: root
        mode: '0600'
    - name: Create labeled event volume
      ansible.builtin.command:
        argv:
          [
            docker,
            volume,
            create,
            --label,
            com.anico.environment=dev,
            --label,
            com.anico.managed-by=ansible,
            anico-dev-events-data,
          ]
      when: anico_events_volume.rc == 1
      changed_when: true
    - name: Prepare data ownership
      ansible.builtin.file:
        path: /var/lib/docker/volumes/anico-dev-events-data/_data
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0700'
      when: not ansible_check_mode
    - name: Validate broker configuration before restart
      ansible.builtin.command:
        argv:
          [
            docker,
            run,
            --rm,
            --network,
            none,
            --user,
            '1000:1000',
            --read-only,
            --cap-drop,
            ALL,
            --security-opt,
            no-new-privileges,
            --mount,
            'type=bind,src=/srv/anico/dev/events/server.json,dst=/etc/nats/server.json,readonly',
            'nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5',
            --test,
            --config,
            /etc/nats/server.json,
          ]
      changed_when: false
      no_log: true
    - name: Start healthy broker with no published ports
      ansible.builtin.command:
        argv: '{{ ["docker", "compose", "--project-name", "anico-dev-events", "--file", "/srv/anico/dev/events/compose.json", "up", "--detach", "--wait", "--wait-timeout", "60"] + (["--force-recreate"] if anico_events_config.changed else []) }}'
      register: anico_events_started
      changed_when: anico_events_started.stderr is search('(?i)(created|started|recreated|pulled)')
    - name: Prepare auth secret directory
      ansible.builtin.file:
        path: /srv/anico/dev/auth/secrets
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Install scoped auth publisher credentials
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../.pulumi/dev-events/publisher.json'
        dest: /srv/anico/dev/auth/secrets/registration-broker.json
        owner: '1000'
        group: '1000'
        mode: '0400'
      no_log: true
    - name: Prepare domain service secret directory
      ansible.builtin.file:
        path: /srv/anico/dev/applications/secrets
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Install scoped breeder publisher and animal consumer credentials
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../.pulumi/dev-events/{{ item }}-verification-broker.json'
        dest: '/srv/anico/dev/applications/secrets/{{ item }}-verification-broker.json'
        owner: '1000'
        group: '1000'
        mode: '0400'
      loop: [breeder, animal]
      no_log: true
    - name: Configure durable streams and pull consumer through temporary private SSH tunnel
      ansible.builtin.command:
        argv:
          [
            node,
            --import,
            tsx,
            '{{ playbook_dir }}/../scripts/configure-dev-events.mjs',
            '{{ inventory_hostname }}',
          ]
        chdir: '{{ playbook_dir }}/..'
      delegate_to: localhost
      become: false
      no_log: true
      register: anico_events_stream
      changed_when: (anico_events_stream.stdout | from_json).changed
    - name: Record configured stream prerequisite
      ansible.builtin.copy:
        content: '{"stream":"ANICO_AUTH_REGISTRATIONS","version":1}'
        dest: /srv/anico/dev/events/stream-ready.json
        owner: root
        group: root
        mode: '0600'
    - name: Record configured verification stream and consumer prerequisite
      ansible.builtin.copy:
        content: '{"stream":"ANICO_BREEDER_VERIFICATIONS","consumer":"animal-verified-breeders","version":1}'
        dest: /srv/anico/dev/events/verification-ready.json
        owner: root
        group: root
        mode: '0600'
    - name: Verify broker isolation and persistence
      ansible.builtin.script:
        cmd: '../scripts/verify-dev-events.py {{ (lookup("ansible.builtin.file", playbook_dir + "/../dev-events.json") | from_json).image }}'
        executable: python3
      changed_when: false
