- name: Audit the existing host
  ansible.builtin.import_playbook: audit.yml

- name: Configure Docker, logging and lifecycle
  ansible.builtin.import_playbook: docker.yml

- name: Prepare shared infrastructure and environment isolation
  ansible.builtin.import_playbook: environments.yml

- name: Deploy the Cloudflare Tunnel connector
  ansible.builtin.import_playbook: cloudflared.yml

- name: Deploy private Coolify and its internal proxy
  ansible.builtin.import_playbook: coolify.yml

- name: Configure managed application projects and environment variables
  ansible.builtin.import_playbook: application-environments.yml

- name: Deploy private developer databases when explicitly enabled
  ansible.builtin.import_playbook: dev-database.yml

- name: Prepare private development registration broker when configured
  ansible.builtin.import_playbook: dev-events.yml

- name: Configure development applications when explicitly enabled
  ansible.builtin.import_playbook: dev-deployment.yml

- name: Install auth runtime when configured
  ansible.builtin.import_playbook: dev-auth.yml
