- name: Configure Docker on the existing AniCo server
  hosts: anico
  become: true
  gather_facts: true
  pre_tasks:
    - name: Verify the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
          - ansible_facts.architecture in ['x86_64', 'aarch64']
        fail_msg: This playbook targets Ubuntu 26.04 amd64/arm64 only.

    - name: Read installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Stop if incompatible container packages are installed
      ansible.builtin.assert:
        that:
          - item not in ansible_facts.packages
        fail_msg: 'Conflicting package {{ item }} found. Review the host before migrating its container runtime.'
      loop:
        - docker.io
        - docker-compose
        - docker-compose-v2
        - docker-doc
        - docker-buildx
        - podman-docker
        - containerd
        - runc

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the official Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Configure the Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Architectures: {{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_repository

    - name: Install Docker Engine and Compose from the official repository
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: '{{ docker_repository.changed }}'

    - name: Configure bounded Docker logging
      ansible.builtin.import_tasks: tasks/docker-logging.yml

    - name: Configure Docker live restore
      ansible.builtin.import_tasks: tasks/docker-lifecycle.yml

    - name: Enable Docker at boot
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Apply daemon configuration before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify the Docker daemon
      ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
      changed_when: false
      when: not ansible_check_mode

    - name: Verify the Docker Compose plugin
      ansible.builtin.command: docker compose version
      changed_when: false
      when: not ansible_check_mode

  handlers:
    - name: Import Docker handlers
      ansible.builtin.import_tasks: handlers/docker.yml
