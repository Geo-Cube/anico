config:
  anico-foundation:serverId: 171254722
  # Replace the documentation address with your actual public IP/CIDR.
  anico-foundation:sshCidrs:
    - 192.0.2.10/32
  anico-foundation:sshPort: 22
  # First preview/up creates an unattached firewall. It does not filter the server.
  anico-foundation:attachFirewall: false
  # OAuth credentials are entered interactively using Pulumi config; see GITHUB-ACCESS.md.
  anico-foundation:githubEnabled: false
  # Enable only after testing the complete login flow; see COOLIFY-SSO.md.
  anico-foundation:githubOnly: false
  anico-foundation:coolifySsoEnabled: false
  anico-foundation:coolifySsoOnly: false
  # Real coolifyTeam and githubClientSecret are encrypted secrets, never examples.
  # Keep disabled until the read-only preflight and Pulumi preview have been reviewed.
  anico-foundation:cloudflare:
    enabled: false
    accountId: REPLACE_WITH_ACCOUNT_ID
    zoneId: REPLACE_WITH_ZONE_ID
    teamName: REPLACE_WITH_ZERO_TRUST_TEAM_NAME
    createOrganization: false
